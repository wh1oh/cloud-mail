name: Deploy Worker

on:
  push:
    branches:
      - main # 改成你的生产分支名,比如 master
    paths:
      - 'mail-worker/**'
      - 'mail-vue/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9 # 按项目实际 pnpm 大版本调整

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml

      - name: Install worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install and build frontend (mail-vue)
        working-directory: mail-vue
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Generate wrangler.toml from secrets
        working-directory: mail-worker
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          MAIL_ADMIN: ${{ secrets.MAIL_ADMIN }}
          MAIL_JWT_SECRET: ${{ secrets.MAIL_JWT_SECRET }}
          MAIL_PROJECT_LINK: ${{ vars.MAIL_PROJECT_LINK }}
          MAIL_DOMAINS: ${{ secrets.MAIL_DOMAINS }}
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
        run: |
          export WORKER_NAME="${WORKER_NAME:-cloud-mail}"
          export MAIL_PROJECT_LINK="${MAIL_PROJECT_LINK:-false}"
          export MAIL_DOMAINS="${MAIL_DOMAINS:-[]}"
          export CUSTOM_DOMAIN="${CUSTOM_DOMAIN:-mail.example.com}"
          envsubst < wrangler.wh1oh.toml.tpl > wrangler.wh1oh.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        env:
          NODE_ENV: development
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mail-worker
          wranglerVersion: '4'
          command: deploy --config wrangler.wh1oh.toml

      - name: Set jwt_secret as Worker Secret
        working-directory: mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.MAIL_JWT_SECRET }}
        run: |
          echo "$JWT_SECRET" | npx wrangler secret put jwt_secret \
            --config wrangler.wh1oh.toml
          #echo "$JWT_SECRET" | npx wrangler secret put jwt_secret \
          #  --config wrangler.wh1oh.toml --name "${{ vars.WORKER_NAME || 'cloud-mail' }}"

      - name: Initialize database
        env:
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          JWT_SECRET: ${{ secrets.MAIL_JWT_SECRET }}
          DEPLOYED_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          RETRY_TIMES: 3
          RETRY_DELAY: 5
        run: |
          set -e

          if [ -n "$CUSTOM_DOMAIN" ]; then
            WORKER_URL="https://$CUSTOM_DOMAIN"
          else
            WORKER_URL="$DEPLOYED_WORKER_URL"
          fi

          if [ -z "$WORKER_URL" ]; then
            echo "❌ Worker URL not available."
            echo "Please set CUSTOM_DOMAIN or check the deploy output."
            exit 1
          fi
          INIT_URL="$WORKER_URL/api/init/$JWT_SECRET"

          echo "🌐 URL: $WORKER_URL"
          echo "🛠️ Starting database initialization..."
          for i in $(seq 1 "$RETRY_TIMES"); do
            echo "🔄 Initialization attempt $i/$RETRY_TIMES..."
            RESPONSE=$(curl -sS \
              -L \
              --connect-timeout 10 \
              --max-time 30 \
              -w '\n%{http_code}' \
              "$INIT_URL") || RESPONSE=""
            HTTP_CODE=$(printf '%s\n' "$RESPONSE" | tail -n1)
            RESPONSE_BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" = "200" ] && [ "$RESPONSE_BODY" = "success" ]; then
              echo "✅ Database initialization completed."
              exit 0
            fi

            echo "⚠️ Failed. HTTP: ${HTTP_CODE:-000}, Response: ${RESPONSE_BODY:-<empty>}"
            if [ "$i" -lt "$RETRY_TIMES" ]; then
              echo "⏳ Retrying in 5 seconds..."
              sleep "$RETRY_DELAY"
            fi
          done
          echo "❌ Database initialization failed after $RETRY_TIMES attempts."
          exit 1

      - name: Cleanup old Worker versions (keep latest 2)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"

          # 1. 通过名字找 worker_id
          WORKER_ID=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "$API/workers/workers?name=$WORKER_NAME" \
            | jq -r --arg n "$WORKER_NAME" '.result[] | select(.name==$n) | .id' | head -n1)

          if [ -z "$WORKER_ID" ]; then
            echo "找不到 worker_id,跳过清理"; exit 0
          fi

          # 2. 当前正在提供流量的版本,永远不删
          ACTIVE_IDS=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "$API/workers/scripts/$WORKER_NAME/deployments" \
            | jq -r '.result.deployments[0].versions[].version_id')

          # 3. 列出全部版本,按时间倒序,跳过最新2个
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "$API/workers/workers/$WORKER_ID/versions?per_page=100" \
            | jq -r '.result | sort_by(.created_on) | reverse | .[2:] | .[].id' > old_versions.txt

          while read -r VID; do
            [ -z "$VID" ] && continue
            if echo "$ACTIVE_IDS" | grep -qx "$VID"; then
              echo "跳过在用版本 $VID"; continue
            fi
            echo "删除版本 $VID"
            curl -s -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" \
              "$API/workers/workers/$WORKER_ID/versions/$VID" || true
          done < old_versions.txt

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: '2'
          keep_minimum_runs: '3'

