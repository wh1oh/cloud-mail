name: Deploy Worker

on:
  push:
    branches:
      - main   # 改成你的生产分支名,比如 master
    paths:
      - 'mail-worker/**'
      - 'mail-vue/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9   # 按项目实际 pnpm 大版本调整

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml

      - name: Install worker dependencies
        working-directory: mail-worker
        run: npm install   # 如果 mail-worker 也用 pnpm 管理,改成 pnpm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mail-worker
          command: deploy --config wrangler.wh1oh.toml
