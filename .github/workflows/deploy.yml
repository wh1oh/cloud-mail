name: Deploy Worker

on:
  push:
    branches:
      - main   # 改成你的生产分支名,比如 master
    paths:
      - 'mail-worker/**'
      - 'mail-vue/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9   # 按项目实际 pnpm 大版本调整

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml

      - name: Install worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install and build frontend (mail-vue)
        working-directory: mail-vue
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          NODE_ENV: development   # 避免自定义 build 内部的 pnpm install 跳过 devDependencies(如 vite)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mail-worker
          wranglerVersion: '4'
          command: deploy --config wrangler.wh1oh.toml
